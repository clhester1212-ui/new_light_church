<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Light Cameras</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1d2330; --muted:#6b7280; --line:#e3e6eb;
          --ok:#1a9b5b; --bad:#c43c3c; --warn:#b7791f; --accent:#2f5fd0; --btn:#eef1f6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --card:#1d2128; --ink:#e8eaee; --muted:#9aa3b2;
          --line:#2c323c; --btn:#2a303a; --accent:#7aa2ff; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
           padding:14px 16px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:2; }
  h1 { font-size:18px; margin:0; }
  .lock { display:flex; gap:8px; align-items:center; }
  .pill { padding:4px 10px; border-radius:99px; font-size:13px; font-weight:600; }
  .pill.locked { background:#e6e9ef; color:#374151; } .pill.unlocked { background:#fdecc8; color:#7a4a00; }
  main { padding:16px; display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .card.retired { opacity:.55; }
  .head { padding:12px 14px; display:flex; justify-content:space-between; align-items:start; gap:8px; }
  .head h2 { margin:0; font-size:17px; } .sub { color:var(--muted); font-size:13px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; background:var(--muted); }
  .dot.on { background:var(--ok); } .dot.off { background:var(--bad); }
  .role { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); white-space:nowrap; }
  .pic { aspect-ratio:16/9; background:#000; display:flex; align-items:center; justify-content:center; color:#888; font-size:13px; }
  .pic img { width:100%; height:100%; object-fit:cover; display:block; }
  .stats { display:flex; gap:14px; padding:8px 14px; font-size:13px; color:var(--muted); border-bottom:1px solid var(--line); }
  .controls { padding:12px 14px; display:grid; gap:10px; }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .label { font-size:12px; color:var(--muted); width:100%; }
  button { font:inherit; font-size:14px; border:1px solid var(--line); background:var(--btn); color:var(--ink);
           border-radius:8px; padding:7px 11px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.stop { background:var(--bad); color:#fff; border-color:var(--bad); font-weight:700; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  select { font:inherit; font-size:14px; padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:var(--btn); color:var(--ink); }
  .pad { display:grid; grid-template-columns:repeat(3, 44px); gap:4px; }
  .pad button { padding:7px 0; }
  .note { font-size:12px; color:var(--muted); padding:0 14px 12px; }
  section.log { padding:0 16px 24px; }
  section.log h3 { font-size:15px; margin:4px 0 8px; }
  #events { font-size:13px; color:var(--muted); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin:0; list-style:none; }
  #events li { padding:2px 0; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:8px 14px; border-radius:8px; font-size:14px; display:none; }
  section.tune { padding:0 16px 16px; }
  section.tune details { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; }
  section.tune summary { cursor:pointer; font-weight:600; }
  .tgroup { margin-top:12px; } .tgroup h4 { margin:0 0 6px; font-size:14px; }
  .trow { display:grid; grid-template-columns:minmax(150px, 230px) 1fr 56px; gap:10px; align-items:center; padding:3px 0; font-size:13px; }
  .trow input[type=range] { width:100%; } .trow .val { font-variant-numeric:tabular-nums; text-align:right; }
  .trow .changed { color:var(--warn); font-weight:600; }
  .help { color:var(--muted); font-size:12px; grid-column:1 / -1; margin-top:-2px; }
  label.sw { display:flex; gap:6px; align-items:center; font-size:13px; }
  @media (max-width:420px) { main { grid-template-columns:1fr; padding:16px; } }
</style>
</head>
<body>
<header>
  <h1>New Light Cameras</h1>
  <div class="lock">
    <label class="sw" title="Lets Companion buttons (URLs ending in from=deck) move cameras without unlocking here"><input type="checkbox" id="deckSw"> Stream Deck control</label>
    <span id="lockPill" class="pill locked">Moves locked</span>
    <button id="lockBtn" class="primary">Unlock moves (10 min)</button>
  </div>
</header>
<main id="cams"></main>
<section class="tune"><details id="tuneBox"><summary>Tracking settings (live, saved automatically)</summary>
  <div class="sub" style="margin-top:6px">Changes take effect right away. Yellow numbers differ from the starting value.
  <button id="tuneReset" style="margin-left:8px">Reset all to starting values</button></div>
  <div id="tune"></div></details></section>
<section class="log"><h3>Recent activity</h3><ul id="events"></ul></section>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
let unlocked = false, built = false;

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 2500); }

async function post(url) {
  const r = await fetch(url, { method: 'POST' });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) toast(j.error || 'Something went wrong');
  refresh();
}

const roleText = { track: 'Will auto-track', presets: 'Presets only', retired: 'Not responding / old' };

function build(cams) {
  $('#cams').innerHTML = cams.map(c => {
    const track = c.role !== 'track' ? '' : `
      <div class="controls trackbox">
        <div class="row"><span class="label">Auto-tracking</span>
          <button class="primary" data-trk="/api/track/${c.id}/steer" data-mv-trk>Track ON</button>
          <button data-trk="/api/track/${c.id}/watch">Watch only</button>
          <button data-trk="/api/track/${c.id}/relock">Re-lock center</button>
          <button data-trk="/api/track/${c.id}/off">Tracking off</button>
        </div>
        <div class="row"><span class="label">Framing while tracking (zooms slowly, keeps them centered)</span>
          <button data-trk="/api/track/${c.id}/frame?size=tight" data-mv-trk>Tight</button>
          <button data-trk="/api/track/${c.id}/frame?size=medium" data-mv-trk>Medium</button>
          <button data-trk="/api/track/${c.id}/frame?size=wide" data-mv-trk>Wide</button>
          <button data-trk="/api/track/${c.id}/pullout" data-mv-trk>Slow pull-out</button>
          <button data-trk="/api/track/${c.id}/frame?size=hold" data-mv-trk>Hold zoom</button>
        </div>
        <div class="row"><span class="label">Go to a preset, then track whoever is center there</span>
          <select id="tp-${c.id}">${c.presets.map(p => `<option value="${p.number}">${p.name}</option>`).join('')}</select>
          <button data-trkpreset="${c.id}" data-mv-trk>Go + track</button>
        </div>
        <div class="row"><span class="label">Stay on stage: aim the camera at each edge of the stage (with the nudge buttons), then press that edge. Tracking won't steer past them.</span>
          <button data-edge="/api/cameras/${c.id}/edge?set=left">◀ Left edge here</button>
          <button data-edge="/api/cameras/${c.id}/edge?set=right">Right edge here ▶</button>
          <button data-edge="/api/cameras/${c.id}/edge?set=low">▼ Bottom edge here</button>
          <button data-edge="/api/cameras/${c.id}/edge?set=high">▲ Top edge here</button>
          <button data-edge="/api/cameras/${c.id}/edge?clear=1">Clear edges</button>
          <span class="sub" id="edges-${c.id}"></span>
        </div>
        <div class="row"><span class="label">Testing</span>
          <button data-rec="${c.id}">Record test video</button>
          <button data-trk="/api/track/${c.id}/measure-delay" data-mv-trk data-slow="Measuring video delay (about 10 seconds)…">Measure video delay</button>
        </div>
        <div class="sub" id="ts-${c.id}">Not tracking</div>
      </div>`;
    const moves = c.role === 'retired' ? '' : `
      <div class="controls">
        <div class="row"><span class="label">Presets</span>
          ${c.presets.map(p => `<button data-mv="/api/cameras/${c.id}/preset/${p.number}" title="Preset ${p.number}">${p.name}</button>`).join('') || '<span class="sub">none saved</span>'}
        </div>
        <div class="row" style="gap:18px; align-items:start">
          <div><span class="label">Nudge</span>
            <div class="pad">
              <span></span><button data-mv="/api/cameras/${c.id}/nudge?dir=up">▲</button><span></span>
              <button data-mv="/api/cameras/${c.id}/nudge?dir=left">◀</button>
              <button data-mv="/api/cameras/${c.id}/home" title="Home">⌂</button>
              <button data-mv="/api/cameras/${c.id}/nudge?dir=right">▶</button>
              <span></span><button data-mv="/api/cameras/${c.id}/nudge?dir=down">▼</button><span></span>
            </div></div>
          <div><span class="label">Zoom</span>
            <div class="row"><button data-mv="/api/cameras/${c.id}/zoom?dir=in">Zoom in</button>
            <button data-mv="/api/cameras/${c.id}/zoom?dir=out">Zoom out</button></div>
            <div class="row" style="margin-top:10px"><button class="stop" data-stop="/api/cameras/${c.id}/stop">STOP</button></div>
          </div>
        </div>
      </div>`;
    return `<div class="card ${c.role === 'retired' ? 'retired' : ''}" id="card-${c.id}">
      <div class="head"><div><h2><span class="dot" id="dot-${c.id}"></span>${c.name}</h2>
        <div class="sub">${c.model || ''} · ${c.ip}${c.serial ? ' · SN ' + c.serial : ''}</div></div>
        <span class="role">${roleText[c.role] || c.role}</span></div>
      ${c.role === 'retired' ? '' : `<div class="pic" id="pic-${c.id}">Loading picture…</div>`}
      <div class="stats" id="stats-${c.id}">Checking…</div>
      ${track}
      ${moves}
      ${c.notes ? `<div class="note">${c.notes}</div>` : ''}
    </div>`;
  }).join('');
  document.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => post(b.dataset.mv));
  document.querySelectorAll('[data-stop]').forEach(b => b.onclick = () => post(b.dataset.stop));
  document.querySelectorAll('[data-trk]').forEach(b => b.onclick = async () => {
    if (b.dataset.slow) { toast(b.dataset.slow); b.disabled = true; }
    const r = await fetch(b.dataset.trk, { method: 'POST' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) toast(j.error || 'Something went wrong');
    else if (j.delay !== undefined) { toast(`Video delay: ${j.delay} s (setting updated)`); loadTuning(); }
    b.disabled = false; refresh(); refreshTrack(); });
  document.querySelectorAll('[data-edge]').forEach(b => b.onclick = async () => {
    if (b.dataset.edge.includes('clear=1') && !confirm('Clear all stage edges for this camera?')) return;
    const r = await fetch(b.dataset.edge, { method: 'POST' });
    const j = await r.json().catch(() => ({}));
    toast(r.ok ? j.detail : (j.error || 'Something went wrong'));
    refresh(); });
  document.querySelectorAll('[data-rec]').forEach(b => b.onclick = () => {
    const id = b.dataset.rec, on = !(tracking[id] && tracking[id].recording);
    post(`/api/track/${id}/record?on=${on ? 1 : 0}`).then(refreshTrack); });
  document.querySelectorAll('[data-trkpreset]').forEach(b => b.onclick = () => {
    const id = b.dataset.trkpreset; post(`/api/track/${id}/preset/${$('#tp-' + id).value}`).then(refreshTrack); });
  built = true;
}

let tracking = {};
async function refreshTrack() {
  const r = await fetch('/api/track'); tracking = await r.json();
  for (const [id, s] of Object.entries(tracking)) {
    const el = $('#ts-' + id); if (!el) continue;
    const rb = document.querySelector(`[data-rec="${id}"]`);
    if (rb) { rb.textContent = s.recording ? '■ Stop recording' : 'Record test video'; rb.classList.toggle('stop', !!s.recording); }
    if (s.mode === 'off') { el.textContent = 'Not tracking'; continue; }
    const who = s.target ? `following for ${s.following_for}s` : '';
    const mode = s.mode === 'steer' ? '<b style="color:#c47a00">STEERING</b>' : 'Watch only';
    const fr = s.framing ? ` · framing: ${s.framing}` : '';
    el.innerHTML = `${mode} · <b>${s.status}</b> ${who ? '· ' + who : ''} · sees ${s.people.length} people · ` +
      `${s.mode === 'steer' ? 'doing' : 'would'}: <b>${s.would || '—'}</b>${fr} · ${s.fps} fps` +
      (s.shadows_ignored ? ` · ${s.shadows_ignored} shadow(s) skipped` : '') + (s.recording ? ' · <b style="color:#c43c3c">● recording</b>' : '');
  }
}
// While a camera is tracking, its picture shows the tracker's view with boxes, refreshed often.
function refreshTrackPics() {
  for (const [id, s] of Object.entries(tracking)) {
    if (s.mode === 'off' || !s.fps) continue;  // no frames yet
    const box = $('#pic-' + id); if (!box) continue;
    const img = new Image();
    img.onload = () => { box.innerHTML = ''; box.appendChild(img); };
    img.src = `/api/track/${id}/view.jpg?t=${Date.now()}`;
  }
}

async function refresh() {
  const r = await fetch('/api/cameras'); const d = await r.json();
  if (!built) build(d.cameras);
  unlocked = d.moves_unlocked;
  $('#lockPill').className = 'pill ' + (unlocked ? 'unlocked' : 'locked');
  $('#lockPill').textContent = unlocked ? `Moves unlocked · ${Math.ceil(d.unlocked_seconds_left / 60)} min left` : 'Moves locked';
  $('#lockBtn').textContent = unlocked ? 'Lock moves now' : 'Unlock moves (10 min)';
  document.querySelectorAll('[data-mv], [data-mv-trk]').forEach(b => b.disabled = !unlocked);
  $('#deckSw').checked = !!d.deck_enabled;
  for (const c of d.cameras) {
    const s = c.live, dot = $('#dot-' + c.id), st = $('#stats-' + c.id);
    if (!dot) continue;
    dot.className = 'dot ' + (s ? (s.online ? 'on' : 'off') : '');
    st.textContent = !s ? 'Checking…' : !s.online ? 'Not answering' :
      `Power ${s.power} · Pan ${s.pan ?? '?'} · Tilt ${s.tilt ?? '?'} · Zoom ${s.zoom ?? '?'}`;
    const ed = $('#edges-' + c.id), e = c.edges || {};
    if (ed) {
      const set = [['left', 'left'], ['right', 'right'], ['low', 'bottom'], ['high', 'top']].filter(([k]) => e[k] != null);
      ed.textContent = set.length ? 'Edges set: ' + set.map(([k, n]) => `${n} ${e[k]}`).join(' · ') : 'No edges set yet: tracking can follow anyone, anywhere.';
    }
  }
  const ev = await (await fetch('/api/events')).json();
  $('#events').innerHTML = ev.map(e => `<li>${new Date(e.ts * 1000).toLocaleString()} — ${e.camera_id ? e.camera_id + ': ' : ''}${e.action}${e.detail ? ' (' + e.detail + ')' : ''}</li>`).join('') || '<li>Nothing yet</li>';
}

async function refreshPics() {
  const r = await fetch('/api/cameras'); const d = await r.json();
  for (const c of d.cameras) {
    const box = $('#pic-' + c.id); if (!box) continue;
    if (tracking[c.id] && tracking[c.id].mode !== 'off') continue;  // tracker view is shown instead
    const img = new Image();
    img.onload = () => { box.innerHTML = ''; box.appendChild(img); };
    img.onerror = () => { if (!box.querySelector('img')) box.textContent = 'No picture'; };
    img.src = `/api/cameras/${c.id}/snapshot.jpg?t=${Date.now()}`;
  }
}

async function loadTuning() {
  const items = await (await fetch('/api/tuning')).json();
  const groups = {};
  items.forEach(it => (groups[it.group] = groups[it.group] || []).push(it));
  $('#tune').innerHTML = Object.entries(groups).map(([g, its]) => `<div class="tgroup"><h4>${g}</h4>` +
    its.map(it => `<div class="trow"><span>${it.label}</span>
      <input type="range" min="${it.min}" max="${it.max}" step="${it.step}" value="${it.value}" data-key="${it.key}">
      <span class="val ${it.value != it.default ? 'changed' : ''}" id="tv-${it.key}" title="Starting value ${it.default}">${it.value}</span>
      <span class="help">${it.help}</span></div>`).join('') + '</div>').join('');
  document.querySelectorAll('#tune input[type=range]').forEach(r => {
    const def = items.find(i => i.key === r.dataset.key).default;
    r.oninput = () => { const v = $('#tv-' + r.dataset.key); v.textContent = r.value; v.classList.toggle('changed', r.value != def); };
    r.onchange = async () => {
      const res = await fetch(`/api/tuning?${r.dataset.key}=${r.value}`, { method: 'POST' });
      if (!res.ok) toast('Could not save that setting'); else toast('Saved');
    };
  });
}
$('#tuneReset').onclick = async () => {
  if (!confirm('Put every tracking setting back to its starting value?')) return;
  await fetch('/api/tuning/reset', { method: 'POST' }); loadTuning(); toast('Settings reset');
};
$('#deckSw').onchange = e => post('/api/deck?on=' + (e.target.checked ? 1 : 0));
loadTuning();
$('#lockBtn').onclick = () => post(unlocked ? '/api/moves/lock' : '/api/moves/unlock');
refresh().then(refreshPics);
setInterval(refresh, 3000);
setInterval(() => { if (!document.hidden) { refreshTrack(); refreshTrackPics(); } }, 700);
setInterval(() => { if (!document.hidden) refreshPics(); }, 6000);
</script>
</body>
</html>
